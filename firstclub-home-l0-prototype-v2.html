<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FirstClub — Home (L0 Prototype v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#EDEDED;
    min-height:100vh;
    padding:24px 12px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stage{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .device{
    width:406px;
    height:860px;
    flex-shrink:0;
    background:#111;
    border-radius:48px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.25);
    position:relative;
    border:8px solid #111;
    transform-origin:top center;
  }
  .screen{
    width:390px;
    height:844px;
    position:relative;
    overflow:hidden;
    background:#FBF7EC;
  }
  .frame{
    position:absolute;
    top:0;left:0;
    width:390px;
    height:844px;
    background-size:390px 844px;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    will-change:opacity;
    pointer-events:none;
  }
  .frame.active{opacity:1;pointer-events:auto;}

  /* single overlay over the tab row: handles both tap-to-select and
     swipe-to-step, so there's no real <button> to show a focus ring */
  .tabbar-overlay{
    position:absolute;
    left:0;
    width:390px;
    z-index:20;
    cursor:pointer;
    touch-action:pan-y;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .hint{
    max-width:406px;
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:14px;
    padding:0 8px;
  }
</style>
</head>

  document.getElementById(`frame-${current}`).classList.add('active');
}

function triggerHaptic(){
  if('vibrate' in navigator){
    try{ navigator.vibrate(10); }catch(e){ /* no-op if blocked */ }
  }
}

function stepTab(direction){
  const idx = ORDER.indexOf(current);
  const nextIdx = idx + direction;
  if(nextIdx < 0 || nextIdx >= ORDER.length) return;
  triggerHaptic();
  setActive(ORDER[nextIdx]);
}

function keyAtLocalX(localX){
  const rects = HOTSPOTS[current];
  for(const key of ORDER){
    const [left,, w] = rects[key];
    if(localX >= left && localX <= left + w) return key;
  }
  return null;
}

// --- unified tap + horizontal swipe handling on the tab row ---
let dragging = false;
let startClientX = 0, startClientY = 0;
let startLocalX = 0;
let moved = false;
const TAP_TOLERANCE = 8;
const SWIPE_THRESHOLD = 40;

function localXFromClientX(clientX){
  const rect = tabbarEl.getBoundingClientRect();
  const scale = rect.width / 390; // account for the responsive scale-to-fit
  return (clientX - rect.left) / scale;
}

function onStart(clientX, clientY){
  dragging = true;
  moved = false;
  startClientX = clientX;
  startClientY = clientY;
  startLocalX = localXFromClientX(clientX);
}

function onMove(clientX, clientY){
  if(!dragging) return;
  if(Math.abs(clientX - startClientX) > TAP_TOLERANCE || Math.abs(clientY - startClientY) > TAP_TOLERANCE){
    moved = true;
  }
}

function onEnd(clientX){
  if(!dragging) return;
  dragging = false;
  const dx = clientX - startClientX;
  if(moved && Math.abs(dx) > SWIPE_THRESHOLD){
    stepTab(dx < 0 ? 1 : -1);
    return;
  }
  if(!moved){
    const key = keyAtLocalX(startLocalX);
    if(key && key !== current){
      triggerHaptic();
      setActive(key);
    }
  }
}

tabbarEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  onStart(t.clientX, t.clientY);
}, {passive:true});
tabbarEl.addEventListener('touchmove', e => {
  const t = e.changedTouches[0];
  onMove(t.clientX, t.clientY);
}, {passive:true});
tabbarEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  onEnd(t.clientX);
}, {passive:true});

tabbarEl.addEventListener('mousedown', e => {
  onStart(e.clientX, e.clientY);
  e.preventDefault();
});
window.addEventListener('mousemove', e => { onMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', e => { onEnd(e.clientX); });

// --- responsive scale-to-fit, so the mockup never overflows the viewport ---
const device = document.getElementById('device');
const DEVICE_W = 406;
const DEVICE_H = 860;

function fitDevice(){
  const available = window.innerWidth - 24; // side padding
  const scale = Math.min(1, available / DEVICE_W);
  device.style.transform = `scale(${scale})`;
  const stage = document.querySelector('.stage');
  stage.style.height = (DEVICE_H * scale) + 'px';
}
window.addEventListener('resize', fitDevice);
window.addEventListener('orientationchange', fitDevice);
fitDevice();
</script>
